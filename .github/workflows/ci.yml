name: Guardrail regression checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FAILPROOFAI_HOME: /tmp/failproof-home
      FAILPROOFAI_NO_FIRST_RUN: "1"
      FAILPROOFAI_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Check the runner
        run: node test.mjs
      - name: Install the pinned engine and policies
        run: |
          npm install --global failproofai@1.0.3
          failproofai policies add FailproofAI/policies@06b802b63f4f --all
      - name: Compare with the reviewed snapshot
        run: |
          cp results.json "$RUNNER_TEMP/failproof-baseline.json"
          node run.mjs --baseline "$RUNNER_TEMP/failproof-baseline.json" --ci
